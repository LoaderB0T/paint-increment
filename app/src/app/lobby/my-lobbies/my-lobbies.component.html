<div class="paper-container">
  <h2>{{ i18n.myLobbies_title() }}</h2>
  <div class="content">
    @if (lobbies.isLoading()) {
      <awd-loading [label]="i18n.shared_loading()" animate.enter="fade-in-late" animate.leave="fade-out" />
    } @else {
      <ul animate.enter="fade-in">
        @for (lobby of lobbies.value(); track lobby.id) {
          <li>
            <a [routerLink]="lobby.link">{{ lobby.name }}</a>
          </li>
        }
      </ul>
    }
  </div>
  <div class="actions">
    <awd-button
      data-testid="back-button"
      (onClick)="navigateHome()"
      [text]="i18n.shared_goHome()"
    />
  </div>
</div>
