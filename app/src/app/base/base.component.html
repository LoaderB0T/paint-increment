<div class="container">
  <div class="paper paper-bg paper-bg-1"></div>
  <div class="paper paper-bg paper-bg-2"></div>
  <div class="paper paper-bg main-placeholder"></div>
  <div class="paper" [class.paper-main]="enableRouterTransitions()">
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- The page being navigated away from is still readable, so this annotates rather
     than covers. `fade-in-late` keeps a fast resolver from flashing it. -->
@if (navigating()) {
  <awd-loading
    class="corner"
    [label]="i18n.shared_loading()"
    animate.enter="fade-in-late"
    animate.leave="fade-out"
  />
}
